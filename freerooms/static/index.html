<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6E7E3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Free Rooms ETH</title>
<script>try { if (localStorage.getItem("fr.cb") === "true") document.documentElement.classList.add("cb"); } catch {}</script>
<style>
  /* Door-sign look: the e-paper room signs at ETH. Paper, ink and e-paper red; free time is left blank.
     --P/--I/--R are the raw colours of the current mode; the hero plate swaps paper and ink. */
  @font-face { font-family: Overpass; src: url(overpass.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
  :root {
    --P: #E6E7E3; --I: #000; --R: #C8102E; --Rinv: #FF3A3A; --G: #2F6B3A; --A: #8A5A00; --F: #565954;
    --paper: var(--P); --ink: var(--I); --red: var(--R); --free: var(--G); --warn: var(--A); --faded: var(--F);
    --closed: var(--F); --tint: rgba(0, 0, 0, .07); --shade: rgba(0, 0, 0, .35);
    --Ginv: #7BC489; --Ainv: #E2B04A;   /* green and amber on the inverted plate */
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --P: #000; --I: #E6E7E3; --R: #FF3A3A; --Rinv: #C8102E; --G: #7BC489; --A: #E2B04A; --F: #9A9D97;
      --tint: rgba(230, 231, 227, .1); --shade: rgba(0, 0, 0, .6); color-scheme: dark; --Ginv: #2F6B3A; --Ainv: #8A5A00; }
  }
  /* Colour-blind safe colours (toggle at the bottom of the page): blue for free / plenty of space,
     orange for booked / almost full, and free time filled in blue so it doesn't rely on red vs. green. */
  :root.cb { --R: #B85400; --Rinv: #F2A65A; --G: #2B5FA6; --A: #8A6D00; --tf: #2B5FA6; --tfinv: #7FA8E8; --Ginv: #7FA8E8; --Ainv: #E2C04A; }
  @media (prefers-color-scheme: dark) { :root.cb { --R: #F2A65A; --Rinv: #B85400; --G: #7FA8E8; --A: #E2C04A; --tf: #7FA8E8; --tfinv: #2B5FA6; --Ginv: #2B5FA6; --Ainv: #8A6D00; } }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* else .row's display: flex wins over the hidden attribute */
  body { margin: 0; background: var(--paper); color: var(--ink);
    font: 400 16px/1.45 Overpass, system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  a { color: inherit; text-underline-offset: 3px; }
  .wrap { max-width: 680px; margin: 0 auto; }

  header { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: 12px 20px 10px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  h1 { font-size: 16px; font-weight: 800; margin: 0; }
  h1 span { color: var(--faded); font-weight: 500; }
  .seg { display: flex; gap: 16px; }
  .seg button { border: 0; background: none; color: var(--faded); font: inherit; font-size: 15px; font-weight: 600;
    padding: 4px 0 2px; border-bottom: 2px solid transparent; cursor: pointer; }
  .seg button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .chip, select, input[type=datetime-local] { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: none;
    border: 1.5px solid var(--ink); border-radius: 3px; padding: 4px 10px 3px; white-space: nowrap; }
  .chip { cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chip.more { border-color: transparent; text-decoration: underline; text-underline-offset: 3px; }
  select { padding-right: 6px; }
  .label { color: var(--faded); font-size: 14px; margin-right: 2px; }
  .chips { display: contents; }
  .sep { width: 8px; }

  main { padding: 6px 20px 48px; }
  .summary { color: var(--faded); font-size: 14px; margin: 8px 0 12px; }
  .summary b { color: var(--ink); }
  h2 { font-size: 15px; font-weight: 800; margin: 30px 0 4px; }
  .empty { color: var(--faded); padding: 28px 0; }
  footer { color: var(--faded); font-size: 13px; margin-top: 32px; line-height: 1.55; max-width: 62ch; }
  .prefs { margin: 14px 0 0; }

  /* A room, building or study space: a row, not a card. Spacing and the timeline separate them. */
  .card { display: block; width: calc(100% + 20px); margin: 0 -10px; padding: 12px 10px 14px; text-align: left;
    background: none; border: 0; border-radius: 3px; font: inherit; color: inherit; cursor: pointer; }
  .card.sel { background: var(--tint); }
  .card.soon { color: var(--faded); }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .name { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; }
  .status { font-size: 16px; font-weight: 700; white-space: nowrap; }
  .card:not(.scard) .status small, .pstatus small { font-size: 14px; font-weight: 500; color: var(--faded); margin-left: 4px; }
  .scard .top { flex-wrap: wrap; row-gap: 0; }
  .scard .status { white-space: normal; }
  .free .status, .s-free { color: var(--ink); }
  .busy .status, .closed .status, .s-busy, .s-closed { color: var(--red); }
  .unknown .status, .s-unknown { color: var(--faded); }
  .meta { color: var(--faded); font-size: 14px; margin-top: 2px; }
  .warn { color: var(--warn); }
  .stale { border: 1.5px solid var(--warn); color: var(--ink); border-radius: 3px; padding: 8px 12px; margin: 6px 0 10px; font-size: 14px; }

  /* Day timeline, 07–22: outlined track, blank = free, red = booked, dots = closed (e-paper dithers its greys). */
  .bar { position: relative; height: 7px; margin-top: 10px; background: var(--tf, transparent);
    border: 1px solid var(--tf, var(--ink)); border-radius: 2px; }
  .bar i { position: absolute; top: 0; bottom: 0; background: var(--red); }
  .bar .off { background: radial-gradient(var(--ink) .7px, transparent .9px) 0 0 / 3px 3px, var(--paper); }
  .bar .cx { background: repeating-linear-gradient(135deg, var(--ink) 0 1px, transparent 1px 4px), var(--paper); }
  .bar .now { position: absolute; top: -7px; width: 0; height: 0; margin-left: -4px;
    border: 4px solid transparent; border-top: 5px solid var(--ink); border-bottom: 0; }
  .ticks { display: flex; justify-content: space-between; color: var(--faded); font-size: 11px; margin-top: 3px; }

  /* The hero: the longest-free room, set as its own door sign (an inverted plate). */
  .card.sign { width: 100%; margin: 10px 0 18px; padding: 20px 20px 16px; background: var(--paper); color: var(--ink);
    --paper: var(--I); --ink: var(--P); --red: var(--Rinv); --faded: var(--P); --tf: var(--tfinv);
    --free: var(--Ginv); --warn: var(--Ainv); }
  .card.sign.sel { box-shadow: 0 0 0 3px var(--P), 0 0 0 5px var(--I); }
  .sign .name { font-size: clamp(44px, 13vw, 64px); line-height: .95; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .sign .until { font-size: 22px; font-weight: 700; margin-top: 12px; }
  .sign .meta { opacity: .75; }
  .sign .bar { height: 10px; margin-top: 18px; border-width: 1.5px; }
  .sign .bar .now { top: -8px; border-width: 5px; border-top-width: 6px; margin-left: -5px; }
  .sign .ticks { opacity: .7; }

  /* Buildings: share of rooms free */
  .ratio { position: relative; height: 7px; border: 1px solid var(--ink); border-radius: 2px; margin-top: 10px; }
  .ratio i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--free); }
  .count { font-size: 17px; font-weight: 700; white-space: nowrap; }
  .count small { color: var(--faded); font-weight: 500; font-size: 14px; }

  /* Panel: bottom sheet on phones, side panel on wide screens. */
  #shade { position: fixed; inset: 0; background: var(--shade); z-index: 9; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #panel { position: fixed; z-index: 10; background: var(--paper); color: var(--ink); overflow-y: auto; overscroll-behavior: contain;
    left: 0; right: 0; bottom: 0; max-height: 88vh; border-top: 2px solid var(--ink);
    padding: 6px 20px calc(28px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .22s ease;
    visibility: hidden; }
  body.panel-open #panel { transform: none; visibility: visible; }
  body.panel-open #shade { opacity: 1; pointer-events: auto; }
  #panel:focus { outline: none; }   /* focused on open so keyboard users land in it; the border already marks it */
  .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--faded); opacity: .5; margin: 4px auto 10px; }
  @media (min-width: 960px) {
    #panel { left: auto; top: 0; width: 440px; max-height: none; border-top: 0; border-left: 2px solid var(--ink);
      padding: 22px 28px 36px; transform: translateX(105%); }
    .grab, #shade { display: none; }
    body.panel-open { padding-right: 440px; }
  }
  @media (prefers-reduced-motion: reduce) { #panel, #shade { transition: none; } }
  .ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .ph .name { font-size: 40px; line-height: 1; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .ph .meta { margin-top: 6px; }
  .x { border: 1.5px solid var(--ink); background: none; color: var(--ink); width: 34px; height: 34px; border-radius: 3px;
    font-size: 16px; line-height: 1; cursor: pointer; flex: none; }
  .pstatus { font-weight: 700; font-size: 20px; margin-top: 12px; }
  .pstatus.s-free { color: var(--ink); }
  #panel h3 { font-size: 15px; font-weight: 800; margin: 26px 0 8px; }
  #panel .bar { height: 10px; border-width: 1.5px; margin-top: 16px; }
  #panel .bar .now { top: -8px; border-width: 5px; border-top-width: 6px; margin-left: -5px; }
  .evts div { display: flex; gap: 12px; padding: 3px 0; font-size: 15px; }
  .evts time { min-width: 100px; flex: none; font-weight: 600; color: var(--red); }
  .evts .cx, .evts .cx time { color: var(--faded); }
  .kv { display: grid; grid-template-columns: minmax(110px, 40%) 1fr; gap: 4px 12px; font-size: 15px; margin: 0; }
  .kv dt { color: var(--faded); }
  .kv dd { margin: 0; }
  .kv dd.today, .kv dt.today { font-weight: 700; color: var(--ink); }
  details { margin-top: 12px; font-size: 15px; }
  summary { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  details h4 { font-size: 14px; margin: 14px 0 4px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .links a { text-decoration: none; border: 1.5px solid var(--ink); border-radius: 3px; padding: 5px 11px 4px; font-size: 14px; font-weight: 600; }
  .plan { display: block; margin-top: 4px; background: #fff; border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; }
  .plan img { display: block; width: 100%; height: auto; }
  .note { color: var(--faded); font-size: 13px; margin-top: 8px; }

  /* Study spaces */
  @media (max-width: 420px) { h1 span { display: none; } }
  .dot { flex: none; display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 8px;
    background: var(--closed); vertical-align: baseline; }
  .dot.green { background: var(--free); } .dot.yellow { background: var(--warn); } .dot.red { background: var(--red); }
  .dot.unknown, .dot.closed { background: none; box-shadow: inset 0 0 0 1.5px var(--faded); }
  .s-green { color: var(--free); } .s-yellow { color: var(--warn); } .s-red { color: var(--red); }
  .s-unknown, .s-closed { color: var(--faded); }
  .scard .name { font-size: 19px; font-weight: 750; }
  .open-now { color: var(--free); } .shut-now { color: var(--red); }
  .subs { margin-top: 8px; padding-top: 2px; }
  .sub { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; padding: 3px 0; }
  .sub .status { font-size: 14px; }
  .scard .usual-now { color: var(--faded); font-size: 14px; font-weight: 500; white-space: nowrap; margin-left: 6px; }
  .srclink { font-size: 14px; white-space: nowrap; }
  .bigocc { font-size: 22px; font-weight: 700; margin-top: 12px; }
  .bigocc .dot { width: 16px; height: 16px; }
  .bigocc small { font-size: 15px; }
  .curve { display: block; width: 100%; height: auto; margin-top: 4px; }
  .curve .area { fill: var(--ink); opacity: .14; } .curve .ln { fill: none; stroke: var(--ink); stroke-width: 1.5; }
  .curve .pt { fill: var(--ink); } .curve .off { fill: var(--faded); opacity: .25; }
  .curve .grid { stroke: var(--faded); stroke-width: 1; stroke-dasharray: 3 3; opacity: .6; } .curve .base { stroke: var(--ink); }
  .curve .now { stroke: var(--red); stroke-width: 1.5; } .curve text { fill: var(--faded); font-size: 10px; }
  /* Popular times: the usual share taken as faint bars behind today's curve, each with a top edge. */
  .curve .usual { fill: var(--faded); opacity: .16; } .curve .utop { stroke: var(--faded); stroke-width: 1.5; }
  .psub { padding: 6px 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { border: 1.5px solid var(--ink); border-radius: 3px; padding: 3px 9px 2px; font-size: 14px; }

  /* Near: the one-tap answer. The nearest good place gets the door-sign plate, with a small caps
     line on top ("Nearest free room, 3 min") the way door signs label what's behind them. */
  .walk { color: var(--ink); font-weight: 700; }
  .sign .kind { font-size: 13px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; margin-bottom: 8px; opacity: .8; }
  .sign.scard .name { font-size: clamp(40px, 12vw, 58px); font-weight: 800; }
  .sign.long .name { font-size: clamp(30px, 9vw, 44px); line-height: 1.02; letter-spacing: -0.015em; }
  .sign .until .dot { width: 14px; height: 14px; }
  .sign .way { font-size: 17px; font-weight: 700; margin-top: 6px; }
  .sign .way::first-letter { text-transform: uppercase; }
  .sign.ask { cursor: default; }
  .sign.ask .name { font-size: clamp(40px, 12vw, 58px); }
  .sign.ask p { margin: 12px 0 0; max-width: 46ch; opacity: .85; }
  .sign .chip { margin-top: 16px; font-size: 15px; padding: 6px 14px 5px; }
  .sign .chip:hover { background: var(--ink); color: var(--paper); }
  .unknown-dist { opacity: .85; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="head">
      <h1>Free rooms <span>at ETH</span></h1>
      <div class="seg" id="view" role="group" aria-label="View">
        <button data-view="rooms" aria-pressed="true">Rooms</button>
        <button data-view="buildings" aria-pressed="false">Buildings</button>
        <button data-view="spaces" aria-pressed="false" aria-label="Study spaces">Study</button>
        <button data-view="near" aria-pressed="false" aria-label="Nearest free place">Near</button>
      </div>
    </div>
    <div class="row" id="when">
      <button class="chip" data-when="now" aria-pressed="true">Now</button>
      <button class="chip" data-when="60">+1h</button>
      <button class="chip" data-when="120">+2h</button>
      <input type="datetime-local" id="at" step="900" aria-label="Pick a time">
    </div>
    <div class="row" id="site">
      <span class="chips" id="sitechips"></span>
      <select id="building" aria-label="Building"><option value="">All buildings</option></select>
    </div>
    <div class="row" id="dur">
      <span class="label">Free for</span>
      <button class="chip" data-min="0">any</button>
      <button class="chip" data-min="45">45m+</button>
      <button class="chip" data-min="90">1½h+</button>
      <button class="chip" data-min="180">3h+</button>
      <span class="sep" aria-hidden="true"></span>
      <button class="chip" id="nearsort" aria-pressed="false">Nearest first</button>
    </div>
    <div id="sfilter" hidden></div>
  </div>
</header>
<main class="wrap">
  <div class="stale" id="stale" role="status" hidden></div>
  <div class="summary" id="summary">Loading…</div>
  <div id="list"></div>
  <footer id="footer"></footer>
  <p class="prefs"><button class="chip" id="cb" aria-pressed="false">Colour-blind safe colours</button>
    <button class="chip" id="rel" aria-pressed="false" title="Don't put rooms often booked at short notice on the door sign while another room is about as good">Prefer reliable rooms</button></p>
</main>
<div id="shade"></div>
<aside id="panel" role="dialog" aria-modal="false" aria-label="Room details" tabindex="-1"></aside>
<script>
const $ = (s, el = document) => el.querySelector(s);
const DAY_START = 7, DAY_END = 22;  // timeline range in hours
const ETH = "https://ethz.ch";

// Campus names as the server stores them (campus.py): one spelling for both universities.
// ETH Zentrum and UZH Zentrum are next door, so they share one "Zentrum" chip.
const CAMPUS_ORDER = ["Zentrum", "Hönggerberg", "Irchel", "Oerlikon", "Basel"];
const CAMPUS_ALIASES = {
  "zürich zentrum": "Zentrum", "zuerich zentrum": "Zentrum", zentrum: "Zentrum", zz: "Zentrum",
  "uzh zentrum": "Zentrum", "eth zentrum": "Zentrum",
  "zürich hönggerberg": "Hönggerberg", "zuerich hoenggerberg": "Hönggerberg", "hönggerberg": "Hönggerberg",
  hoenggerberg: "Hönggerberg", zh: "Hönggerberg", "eth hönggerberg": "Hönggerberg",
  irchel: "Irchel", "uzh irchel": "Irchel", oerlikon: "Oerlikon", "uzh oerlikon": "Oerlikon", basel: "Basel", ac: "Basel",
  "botanischer garten": "Zentrum",
};
const canonCampus = s => s == null ? null : CAMPUS_ALIASES[String(s).trim().toLowerCase()] || String(s).trim() || null;
const campusRank = c => { const i = CAMPUS_ORDER.indexOf(c); return i < 0 ? CAMPUS_ORDER.length : i; };
const byCampus = (a, b) => campusRank(a) - campusRank(b) || a.localeCompare(b);
const natural = (a, b) => String(a).localeCompare(String(b), "en", { numeric: true });

const store = {
  get(k, d) { try { const v = localStorage.getItem("fr." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("fr." + k, JSON.stringify(v)); } catch {} },
};
const state = {
  view: store.get("view", "rooms"),            // "rooms" | "buildings" | "spaces" | "near"
  when: "now",                                   // "now" | minutes offset | ISO string
  where: null,                                   // { uni: "" | "ETH" | "UZH", campus: "" | campus name }, see loadWhere
  building: store.get("building", ""),
  min: store.get("min", 45),
  data: null,
  room: null,                                    // id of the room shown in the panel
  place: null,                                   // id of the study place shown in the panel (never both)
  pushed: false,                                // did we add a history entry for the panel?
  nearSort: store.get("nearsort", false),        // Rooms, Buildings, Study: nearest first
  reliable: store.get("reliable", false),        // "Prefer reliable rooms": down-rank flagged rooms (heroFirst)
  pos: null,                                     // { lat, lon, acc } from the browser, never stored or sent
  geo: "off",                                    // "off" | "asking" | "ok" | "denied" | "error" | "unsupported"
};
const details = new Map();                       // room id -> detail JSON (or Promise)

// Rooms and Buildings filter. Before Phase 2 it was one ETH site ("Zürich Zentrum"), stored as fr.site.
function loadWhere() {
  const w = store.get("where", null);
  if (w && typeof w === "object") return { uni: w.uni || "", campus: canonCampus(w.campus) || "" };
  return { uni: "", campus: canonCampus(store.get("site", "Zentrum")) || "" };
}
state.where = loadWhere();
// The same filter model in every view: university chips and campus chips, both optional.
const matchWhere = (x, f) => (!f.uni || x.uni === f.uni) && (!f.campus || x.campus === f.campus);
const chip = (attr, val, label, on) => `<button class="chip" data-${attr}="${esc(val)}" aria-pressed="${on}">${esc(label)}</button>`;
function whereChips(items, f) {
  const unis = [...new Set(items.map(x => x.uni).filter(Boolean))].sort();
  const camps = new Set(items.filter(x => x.campus && (!f.uni || x.uni === f.uni)).map(x => x.campus));
  if (f.campus) camps.add(f.campus);   // keep the chosen one visible, so it can be switched off
  return (unis.length > 1 ? unis.map(u => chip("uni", u, u, f.uni === u)).join("") + `<span class="sep" aria-hidden="true"></span>` : "") +
    [...camps].sort(byCampus).map(c => chip("campus", c, c, f.campus === c)).join("");
}
// Tap again = off. Picking a university that has nothing on the chosen campus drops the campus.
function clickWhere(f, data, items) {
  if (data.uni) {
    f.uni = f.uni === data.uni ? "" : data.uni;
    if (f.campus && !items.some(x => matchWhere(x, f))) f.campus = "";
  } else if (data.campus) { f.campus = f.campus === data.campus ? "" : data.campus; state.autoCampus = null; }
}
// Campus and university for a meta line, leaving out what the filter already says.
const multiUni = items => new Set(items.map(x => x.uni)).size > 1;
const whereText = (x, f, unis) => [f.campus ? null : x.campus, unis && !f.uni ? x.uni : null].filter(Boolean).join(", ");

const pad = n => String(n).padStart(2, "0");
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const hm = iso => iso.slice(11, 16);
const toMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const q = o => new URLSearchParams(o).toString();
// Mon–Sun (YYYY-MM-DD) of the week containing the date in `iso`. ETH's schedule page
// needs both `from` and `to`; without `to` its script throws and the timetable stays empty.
function weekOf(iso) {
  const d = new Date(iso.slice(0, 10) + "T00:00Z");
  d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7);
  const from = d.toISOString().slice(0, 10);
  d.setUTCDate(d.getUTCDate() + 6);
  return { from, to: d.toISOString().slice(0, 10) };
}
function dur(min) {
  if (min == null) return "";
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h}h ${pad(m)}m` : `${h}h`;
}
function untilLabel(r, at) {
  if (!r.until) return "rest of day";
  if (r.until.slice(0, 10) === at.slice(0, 10)) return hm(r.until);
  return new Date(r.until).toLocaleDateString("en-GB", { weekday: "short" }) + " " + hm(r.until);
}
function statusText(r, at) {
  if (r.state === "free" && !r.hours_known) return r.until && r.until.slice(0, 10) === at.slice(0, 10) ? `free until ${hm(r.until)}?` : "free?";
  if (r.state === "free") return `free until ${untilLabel(r, at)}` + (r.minutes != null ? ` <small>${dur(r.minutes)}</small>` : "");
  if (r.state === "busy") return `busy until ${untilLabel(r, at)}`;
  if (r.state === "closed") return "building closed";
  return "no data";
}
const TYPES = { "3430": "Lecture hall", "3420": "Seminar room", "3650": "Computer room" };
const typeName = r => TYPES[r.typecode] || r.type;
const places = r => r.seats ? `${r.seats} seats` : r.workplaces ? `${r.workplaces} workplaces` : null;
function hoursText(b) {
  const h = state.data.buildings?.[b];
  if (!h) return null;
  return h.closed ? "closed all day" : `open ${h.open}–${h.close}`;
}
const SOURCE_NAMES = {
  eth_rooms: "ETH room bookings", uzh_rooms: "UZH room bookings", eth_studyspaces: "ETH study space list", eth_availability: "ETH study space occupancy",
  icbp: "ICBP library occupancy", uzh_ub: "UZH library occupancy",
};
function ago(iso) {
  const min = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if (min < 1) return "just now";
  if (min < 90) return `${min} min ago`;
  if (min < 48 * 60) return `${Math.round(min / 60)} h ago`;
  return `${Math.round(min / 1440)} days ago`;
}
// Freshness is judged against the browser clock, so it keeps ticking between reloads.
function renderHealth(d, main = "eth_rooms") {
  const srcs = Object.entries(d.health?.sources || {});
  const stale = srcs.filter(([, s]) => !s.last_success || Date.now() - new Date(s.last_success) > s.max_age_s * 1000);
  $("#stale").hidden = !stale.length;
  $("#stale").innerHTML = stale.map(([k, s]) => `<b>${esc(SOURCE_NAMES[k] || k)} may be out of date</b>: ` +
    (s.last_success ? `last updated ${ago(s.last_success)}` : "never updated") +
    (s.last_error ? ", the last update failed" : "") +
    (k === "eth_rooms" ? ". Check ETH's own room schedule before relying on it." : ". Occupancy shown may be old.")).join("<br>");
  const rooms = d.health?.sources?.[main];
  if (main && rooms?.last_success) $("#summary").insertAdjacentHTML("beforeend",
    `, <span${stale.length ? ' class="warn"' : ""}>updated ${ago(rooms.last_success)}</span>`);
}
const goodFor = r => r.state === "free" && (r.minutes ?? 1e9) >= state.min;

// --- location (Phase 3) ---
// The position comes from the browser and stays in this tab: distances are worked out here and
// never sent to the server. Same maths as geo.py: haversine, 80 m/min, paths 25 % longer than straight.
const WALK_M_PER_MIN = 80, DETOUR = 1.25, NEAR_CAMPUS_M = 500;
function distM(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dp = rad(b.lat - a.lat), dl = rad(b.lon - a.lon);
  const h = Math.sin(dp / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const walkMin = m => Math.max(1, Math.ceil(m * DETOUR / WALK_M_PER_MIN));   // = geo.walk_min
const COMPASS = ["north", "north-east", "east", "south-east", "south", "south-west", "west", "north-west"];
function heading(a, b) {   // compass word from a to b (flat-earth is fine at campus scale)
  const dx = (b.lon - a.lon) * Math.cos(a.lat * Math.PI / 180), dy = b.lat - a.lat;
  return COMPASS[Math.round(((Math.atan2(dx, dy) * 180 / Math.PI) + 360) % 360 / 45) % 8];
}
// Metres from the user to x (a room or place with lat/lon), or null when either is unknown.
const dist = x => state.pos && x && x.lat != null && x.lon != null ? distM(state.pos, x) : null;
function walkText(m, long = false) {
  if (m == null) return null;
  if (m < 40) return "right here";
  if (m > 2500) return `${(m / 1000).toFixed(1)} km away`;   // that's a tram ride, not a walk
  const metres = m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`;
  return long ? `${walkMin(m)} min walk, ${metres}` : `${walkMin(m)} min walk`;
}
const walkHTML = x => { const t = walkText(dist(x)); return t ? `<span class="walk">${esc(t)}</span>` : ""; };
const geo = {
  watch: null,
  supported: "geolocation" in navigator,
  // Only ever started by a tap, or on load when this browser already said yes once (fr.geo).
  start() {
    if (!this.supported) { state.geo = "unsupported"; render(); return; }
    if (this.watch !== null) return;
    state.geo = state.pos ? "ok" : "asking";
    this.watch = navigator.geolocation.watchPosition(p => {
      const c = p.coords, prev = state.pos, first = !prev;
      state.pos = { lat: c.latitude, lon: c.longitude, acc: c.accuracy };
      state.geo = "ok"; store.set("geo", true);
      if (first) autoCampus();
      // Re-render on the first fix and when the user has moved noticeably, not on every jitter.
      if (first || distM(prev, state.pos) > 25 || Math.abs((prev.acc || 0) - c.accuracy) > 100) render();
    }, e => {
      state.geo = e.code === 1 ? "denied" : "error";
      if (e.code === 1) { store.set("geo", false); this.stop(); }
      render();
    }, { enableHighAccuracy: false, maximumAge: 60000, timeout: 20000 });
    render();
  },
  stop() { if (this.watch !== null) navigator.geolocation.clearWatch(this.watch); this.watch = null; },
};
const wantsGeo = () => state.view === "near" || state.nearSort;
// Within ~500 m of a campus (its nearest room or study place), pick that campus once per page load,
// so "Nearest first" starts on the campus the user is standing on. Only for this visit: what's saved
// (fr.where) stays the user's own choice, see saveWhere.
let campusPicked = false;
function autoCampus() {
  if (campusPicked || !state.pos || state.view === "near") return;
  campusPicked = true;
  const all = [...(state.data?.rooms || []), ...(state.places?.places || [])].filter(x => x.campus && dist(x) != null);
  const best = all.reduce((a, x) => (a && dist(a) <= dist(x) ? a : x), null);
  if (best && dist(best) <= NEAR_CAMPUS_M && state.where.campus !== canonCampus(best.campus)) {
    state.userCampus = state.where.campus;
    state.where.campus = state.autoCampus = canonCampus(best.campus);
    if (state.data) fillBuildings();
  }
}
// Save the filter, but with the user's own campus while the automatic one is still in effect.
function saveWhere() {
  const auto = state.autoCampus && state.where.campus === state.autoCampus;
  store.set("where", auto ? { ...state.where, campus: state.userCampus } : state.where);
}
// Nearest first, places without coordinates last (in their previous order).
const byDist = (a, b) => (dist(a) ?? 1e12) - (dist(b) ?? 1e12);
const nearOn = () => state.nearSort && !!state.pos;

function atParam() {
  if (state.when === "now") return "";
  if (typeof state.when === "number") return isoLocal(new Date(Date.now() + state.when * 60000));
  return state.when;
}

async function load() {
  const at = atParam();
  const res = await fetch("api/rooms" + (at ? "?" + q({ at }) : ""));
  setData(await res.json());
  fillBuildings(); render();
}
function setData(d) {
  for (const r of d.rooms || []) { r.uni ||= "ETH"; r.campus = canonCampus(r.campus || r.site); }
  state.data = d;
}

function siteRooms() { return state.data.rooms.filter(r => matchWhere(r, state.where)); }

function fillBuildings() {
  const sel = $("#building");
  const bs = [...new Set(siteRooms().map(r => r.building))].sort(natural);
  sel.innerHTML = `<option value="">All buildings</option>` + bs.map(b => `<option>${esc(b)}</option>`).join("");
  if (!bs.includes(state.building)) state.building = "";
  sel.value = state.building;
}

function timelineBar(timeline, atISO, ticks) {
  const span = (DAY_END - DAY_START) * 60, x = m => Math.max(0, Math.min(100, (m - DAY_START * 60) / span * 100));
  let html = "";
  for (const [s, e, , kind] of timeline) {
    const a = x(toMin(s)), b = x(e === "23:59" ? 1440 : toMin(e));
    const cls = kind === "closed" ? "off" : kind === "cancelled" ? "cx" : "";
    if (b > a) html += `<i${cls ? ` class="${cls}"` : ""} style="left:${a}%;width:${b - a}%"></i>`;
  }
  html += `<b class="now" style="left:${x(toMin(hm(atISO)))}%"></b>`;
  const t = ticks ? `<div class="ticks"><span>${DAY_START}</span><span>10</span><span>13</span><span>16</span><span>19</span><span>${DAY_END}</span></div>` : "";
  return `<div class="bar" aria-hidden="true">${html}</div>${t}`;
}

function card(r, at, unis) {
  const soon = r.state === "free" && r.minutes != null && r.minutes < state.min;
  const meta = [places(r), typeName(r), whereText(r, state.where, unis)].filter(Boolean).join(", ");
  const walk = state.pos ? walkHTML(r) : "";
  const warn = (r.state !== "unknown" && !r.hours_known ? `, <span class="warn">opening hours unknown</span>` : "") + flagNote(r);
  const now = r.state === "busy" && r.reason ? `<div class="meta">Now: ${esc(r.reason)}</div>` : "";
  return `<button class="card ${r.state}${soon ? " soon" : ""}${state.room === r.id ? " sel" : ""}" data-id="${esc(r.id)}">
    <div class="top"><span class="name">${esc(r.id)}</span><span class="status">${statusText(r, at)}</span></div>
    <div class="meta">${walk}${walk && meta ? ", " : ""}${esc(meta)}${warn}</div>${now}
    ${timelineBar(r.timeline, at, false)}</button>`;
}

// Rooms that often get booked at short notice or closed (server: reliability.py) always get a small note.
// With "Prefer reliable rooms" on (off by default) they also don't get the door-sign plate while a room
// that isn't flagged is about as good: in the Rooms view the next one in the list, in Near (or with
// Nearest first) the nearest one at most HERO_SLACK_M farther away.
const HERO_SLACK_M = 250;
const flagNote = r => r.unreliable ? `, <span class="warn" title="${esc(r.unreliable_reason || "")}">often booked at short notice</span>` : "";
function heroFirst(list, flagged, d = () => null) {
  if (!state.reliable || !list.length || !flagged(list[0])) return list;
  const d0 = d(list[0]);
  const i = list.findIndex(x => !flagged(x) && (d0 == null || d(x) == null || d(x) - d0 <= HERO_SLACK_M));
  return i > 0 ? [list[i], ...list.slice(0, i), ...list.slice(i + 1)] : list;
}

// The longest-free room, set as its own door sign at the top of the Rooms view.
function heroCard(r, at, unis, kind = nearOn() ? "Nearest free room" : null) {
  const meta = [r.minutes != null ? `${dur(r.minutes)} free` : null, places(r), typeName(r), whereText(r, state.where, unis),
    r.next_kind === "closed" ? "then the building closes" : null].filter(Boolean).join(", ");
  const warn = (r.hours_known ? "" : `, <span class="warn">opening hours unknown</span>`) + flagNote(r);
  const d = state.pos ? dist(r) : null;
  return `<button class="card sign free${state.room === r.id ? " sel" : ""}" data-id="${esc(r.id)}">
    ${kind ? `<div class="kind">${esc(kind)}</div>` : ""}
    <div class="name">${esc(r.id)}</div>
    <div class="until">Free until ${untilLabel(r, at)}${r.hours_known ? "" : "?"}</div>
    ${d != null ? `<div class="way">${esc(walkText(d, true))}${d >= 40 ? ` ${heading(state.pos, r)}` : ""}</div>` : ""}
    <div class="meta">${esc(meta)}${warn}</div>
    ${timelineBar(r.timeline, at, true)}</button>`;
}

function whenText(at) {
  return state.when === "now" ? "right now" : new Date(at).toLocaleString("en-GB", { weekday: "short", hour: "2-digit", minute: "2-digit" });
}

function renderRooms(d, at) {
  const rooms = siteRooms().filter(r => !state.building || r.building === state.building);
  // Longest free first; rooms without opening-hours data go last (their "free until" is unreliable).
  const byLen = (a, b) => (b.hours_known - a.hours_known) || (b.minutes ?? 1e9) - (a.minutes ?? 1e9) ||
    ((b.seats || b.workplaces || 0) - (a.seats || a.workplaces || 0)) || natural(a.id, b.id);
  const free = heroFirst(rooms.filter(goodFor).sort(nearOn() ? (a, b) => byDist(a, b) || byLen(a, b) : byLen),
    r => r.unreliable, r => nearOn() ? dist(r) : null);
  const short = rooms.filter(r => r.state === "free" && !goodFor(r)).sort(byLen);
  const soonFree = rooms.filter(r => r.state === "busy").sort((a, b) => a.until.localeCompare(b.until) || natural(a.id, b.id)).slice(0, 8);
  const unis = multiUni(rooms), c = r => card(r, at, unis);
  const closed = rooms.some(r => r.state === "closed");

  $("#summary").innerHTML = `<b>${free.length}</b> room${free.length === 1 ? "" : "s"} free ${whenText(at)}` +
    (state.min ? ` for ${dur(state.min)}+` : "") + `, ${rooms.length} checked` +
    (state.building && hoursText(state.building) ? `, ${esc(state.building)} ${hoursText(state.building)}` : "");
  let html = free.length ? heroCard(free[0], at, unis) + free.slice(1).map(c).join("") : "";
  if (!free.length) html += `<div class="empty">${closed && !short.length ? "Buildings are closed at this time." : "Nothing free for that long. Try a shorter duration."}</div>`;
  if (short.length) html += `<h2>Free, but only briefly</h2>` + short.map(c).join("");
  if (soonFree.length) html += `<h2>Busy, free soon</h2>` + soonFree.map(c).join("");
  $("#list").innerHTML = html;
}

function renderBuildings(d, at) {
  const by = new Map();
  const rooms = siteRooms(), unis = multiUni(rooms);
  for (const r of rooms) {
    const b = by.get(r.building) || { name: r.building, uni: r.uni, campus: r.campus, lat: r.lat, lon: r.lon, total: 0, free: 0, seats: 0 };
    b.total++;
    if (goodFor(r)) { b.free++; b.seats += r.seats || r.workplaces || 0; }
    by.set(r.building, b);
  }
  const busiest = (a, b) => b.free - a.free || b.seats - a.seats || natural(a.name, b.name);
  // Nearest first still puts buildings with nothing free at the end.
  const list = [...by.values()].sort(nearOn() ? (a, b) => !b.free - !a.free || byDist(a, b) || busiest(a, b) : busiest);
  const nFree = list.reduce((s, b) => s + b.free, 0);
  $("#summary").innerHTML = `<b>${nFree}</b> free room${nFree === 1 ? "" : "s"} in <b>${list.filter(b => b.free).length}</b> of ${list.length} buildings ${whenText(at)}` +
    (state.min ? ` for ${dur(state.min)}+` : "");
  $("#list").innerHTML = list.map(b => {
    const hours = hoursText(b.name);
    const meta = [b.free ? `${b.seats} seats free` : null, hours, whereText(b, state.where, unis)].filter(Boolean).join(", ");
    const walk = state.pos ? walkHTML(b) : "";
    return `<button class="card${b.free ? "" : " soon"}" data-building="${esc(b.name)}">
      <div class="top"><span class="name">${esc(b.name)}</span><span class="count">${b.free} <small>of ${b.total} free</small></span></div>
      <div class="meta">${walk}${walk && meta ? ", " : ""}${esc(meta)}</div>
      <div class="ratio" aria-hidden="true"><i style="width:${b.total ? b.free / b.total * 100 : 0}%"></i></div></button>`;
  }).join("") || `<div class="empty">No rooms in this area.</div>`;
}

function render() {
  const spaces = state.view === "spaces", near = state.view === "near";
  for (const b of document.querySelectorAll("#view button")) b.setAttribute("aria-pressed", String(b.dataset.view === state.view));
  for (const id of ["#when", "#site"]) $(id).hidden = spaces || near;
  $("#dur").hidden = spaces;
  $("#nearsort").hidden = near;
  $("#nearsort").setAttribute("aria-pressed", String(state.nearSort));
  $("#sfilter").hidden = !spaces;
  if (spaces) { renderSpaces(); return; }
  if (near) { renderNear(); return; }
  const d = state.data, at = d?.at;
  if (!d) { $("#summary").textContent = "Loading…"; $("#list").innerHTML = ""; return; }
  if (!d.last_fetch) {
    $("#summary").textContent = "No data yet. The first fetch takes about 1 minute, reload then.";
    $("#list").innerHTML = ""; return;
  }
  $("#sitechips").innerHTML = whereChips(d.rooms, state.where);
  const unis = [...new Set(d.rooms.map(r => r.uni))].sort();
  $("h1 span").textContent = "at " + (unis.length ? unis.join(" & ") : "ETH");
  $("#building").hidden = state.view === "buildings";
  (state.view === "buildings" ? renderBuildings : renderRooms)(d, at);
  renderHealth(d);
  if (state.nearSort) $("#summary").insertAdjacentHTML("beforeend", geoNote());
  const lf = new Date(d.last_fetch).toLocaleString("en-GB", { dateStyle: "short", timeStyle: "short" });
  const uzh = unis.includes("UZH");
  $("#footer").innerHTML = `Data from ETH Rauminfo${uzh ? " and UZH 3V-Rooms" : ""}, fetched ${lf}. ` +
    `For ETH, only centrally managed rooms (Rektoratsräume) are listed, since other rooms are booked through channels that aren't published. ` +
    `“Free” means nothing is scheduled. The room may still be locked or used informally, and short-notice bookings can be missing. Not an official ${uzh ? "ETH or UZH" : "ETH"} service.`;
  if (state.room) renderPanel();
}

// --- room panel ---
const HIGHLIGHTS = ["PL.SITZ.SITZPL", "PL.SITZ.ARBPL", "PL.SITZ.BESTU", "AUS.FENSTER", "NUTZ.FOOD", "AUS.STROM", "RAUM.BODENFL", "HIFR.ZUG.RST"];

function detailHTML(det) {
  if (!det) return `<p class="meta">Loading room details…</p>`;
  if (det.error) return `<p class="meta">Couldn't load room details from ETH right now.</p>`;
  const all = det.tabs.flatMap(t => t.items);
  const hi = HIGHLIGHTS.flatMap(p => all.filter(i => i.name && i.name.startsWith(p)));
  const kv = items => `<dl class="kv">${items.map(i => `<dt>${esc(i.label)}</dt><dd>${esc(i.value)}</dd>`).join("")}</dl>`;
  let html = det.description ? `<p>${esc(det.description)}</p>` : "";
  html += hi.length ? kv(hi) : `<p class="meta">No details listed.</p>`;
  if (det.tabs.length) html += `<details><summary>All room details</summary>${det.tabs.map(t => `<h4>${esc(t.title)}</h4>${kv(t.items)}`).join("")}</details>`;
  return html;
}

function loadDetail(id) {
  if (details.has(id)) return;
  details.set(id, null);
  fetch("api/roomdetail?" + q({ id }))
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .catch(() => ({ error: true }))
    .then(det => { details.set(id, det); if (det.error) setTimeout(() => details.delete(id), 30000); if (state.room === id) $("#pdetail").innerHTML = detailHTML(det); });
}

// Official UZH pages (checked Nov 2026): the map selects the building and links its floor plans;
// the 3V-Rooms calendar opens anonymously on today's Zentrum overview (no deep link to one room).
const UZH_MAP = b => `https://plaene.uzh.ch/?${q({ buildingCode: b })}`;
const UZH_CALENDAR = "https://uzh.book.3vrooms.app/default/Anonymous/Calendar/PortalFind";
const UZH_ACCESS = b => `https://www.uniability.uzh.ch/static/current/buildings/${encodeURIComponent(b)}/`;
const ext = (href, label) => `<a href="${esc(href)}" target="_blank" rel="noopener">${label} ↗</a>`;

function renderPanel() {
  const r = state.data.rooms.find(x => x.id === state.room);
  if (!r) { closePanel(); return; }
  const at = state.data.at, eth = r.uni === "ETH";
  // The 5-minute refresh rebuilds the panel: keep keyboard focus, scroll and open <details>.
  const refresh = $("#panel").dataset.room === r.id;
  const focus = refresh ? panelFocus() : null, keepOpen = refresh && !!$("#panel details")?.open;
  const loc = { building: r.building, floor: r.floor, room: r.room };
  const day = at.slice(0, 10) === state.data.now.slice(0, 10) ? "Today" : new Date(at).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" });
  // Cancelled entries (type 13 / findetStatt 0) are listed struck through: other tools show them as booked.
  const busy = r.timeline.filter(i => i[3] === "busy" || i[3] === "cancelled");
  const evts = busy.length ? busy.map(([s, e, t, k]) => k === "cancelled"
      ? `<div class="cx" title="Not held: the room is free"><time>${s}–${e}</time><span>cancelled: <s>${esc(t || "booking")}</s></span></div>`
      : `<div><time>${s}–${e}</time><span>${esc(t || "booked")}</span></div>`).join("")
                           : `<div><span class="meta">No bookings.</span></div>`;
  const hours = hoursText(r.building);
  const svg = `${ETH}/content/dam/ethz/common/images/arealplaene/gebaeudeorientierung/${encodeURIComponent(r.building)}.svg`;
  $("#panel").innerHTML = `<div class="grab"></div>
    <div class="ph"><div><div class="name">${esc(r.id)}</div>
      <div class="meta">${esc([typeName(r), places(r), r.campus, r.uni].filter(Boolean).join(", "))}</div></div>
      <button class="x" id="close" aria-label="Close">✕</button></div>
    <div class="pstatus s-${r.state}">${statusText(r, at)}</div>
    ${r.state === "busy" && r.reason ? `<div class="meta">Now: ${esc(r.reason)}</div>` : ""}
    ${hours ? `<div class="meta">Building ${esc(r.building)} ${hours}</div>` : ""}
    ${r.unreliable ? `<div class="meta"><span class="warn">Often booked at short notice</span>${r.unreliable_reason ? `: ${esc(r.unreliable_reason)}` : ""}. It may be taken or closed although it shows as free.</div>` : ""}
    ${dist(r) != null ? `<div class="meta"><span class="walk">${esc(walkText(dist(r), true))}</span> ${dist(r) >= 40 ? heading(state.pos, r) : ""}, to the middle of ${esc(r.building)}</div>` : ""}
    <h3>${esc(day)}</h3>
    ${timelineBar(r.timeline, at, true)}
    <div class="evts" style="margin-top:8px">${evts}</div>
    ${eth ? `<div class="links">

// The same panel shows a room (#room=…) or a study place (#place=…); `kind` says which.
function openPanel(id, push = true, kind = "room") {
  const wasOpen = !!(state.room || state.place);
  state.room = kind === "room" ? id : null;
  state.place = kind === "place" ? id : null;
  if (push) {
    const url = `#${kind}=` + encodeURIComponent(id);
    // One history entry per panel session, so Back closes it (on phones that's the natural gesture).
    if (state.pushed) history.replaceState({ [kind]: id }, "", url); else { history.pushState({ [kind]: id }, "", url); state.pushed = true; }
  }
  if (kind === "place" && state.view !== "spaces" && state.view !== "near") {   // e.g. Back to a #place= entry from another view
    state.view = "spaces"; render(); if (!state.places) loadPlaces();
    if (!state.place) return;      // render() already closed it: unknown id
  }
  if (kind === "room" && state.view === "spaces") { state.view = "rooms"; render(); }   // e.g. Back to a #room= entry
  if (kind === "place" && !state.places) loadPlaces();
  delete $("#panel").dataset[kind === "room" ? "place" : "room"];
  $("#panel").setAttribute("aria-label", kind === "room" ? "Room details" : "Study place details");
  document.body.classList.add("panel-open");

function closePanel(fromHistory = false) {

  delete $("#panel").dataset.place; delete $("#panel").dataset.room;   // reopening later is a fresh open, not a refresh
  document.body.classList.remove("panel-open");

    if (state.pushed) history.back(); else history.replaceState(null, "", location.pathname + location.search);
  }
  state.pushed = false;

}

window.addEventListener("popstate", () => {

const PLACES_EVERY = 60 * 1000;
const STALE_S = 15 * 60;              // a sample older than this is shown as stale, not as current
// Nice labels for known feature keys. MAIN_FEATURES are always offered as chips (when present in the data);
// any other key goes under "More…" with the label the source gave it.
const FEATURES = {
  "um.ruhig": "Quiet", quiet: "Quiet", "aus.stromviel": "Sockets", sockets: "Sockets", "24h": "24 h",
  "aus.fenster": "Windows", windows: "Windows",
  "aus.rollstuhl": "Wheelchair access", "aus.rollstuhlap": "Wheelchair desks", "work.gruppe": "Group work",
  "work.coworking": "Coworking", "aus.bildschirmap": "Screens", "um.normal": "Some noise", "um.laut": "Noisy",
  "aus.stromwenig": "Few sockets", "food.mensa": "Mensa", "food.cafeteria": "Cafeteria",
};
const MAIN_FEATURES = ["Quiet", "Sockets", "24 h", "Windows"];
Object.assign(state, { places: null, placesAt: 0, placesErr: false, sp: loadSp(), spMore: false });
// The study view shares the university/campus choice with Rooms and Buildings (state.where, fr.where);
// only the feature chips are its own (fr.sp).
function loadSp() {

  for (const k of ["uni", "campus"])
    Object.defineProperty(sp, k, { enumerable: true, get: () => state.where[k], set: v => { state.where[k] = v; } });
  return sp;

async function loadPlaces() {

    const res = await fetch("api/places");
    if (!res.ok) throw new Error(res.status);

// Hours come in whatever shape the source stores: a list of lines, a string, or an object holding
// the lines (lines / raw / hours / text) next to extras like has24HourAccess and isOpen.
function hoursLines(h) {
  if (h == null) return [];
  if (typeof h === "string") return h.split(/\n|;\s*/).map(x => x.trim()).filter(Boolean);
  if (Array.isArray(h)) return h.flatMap(x => typeof x === "string" ? hoursLines(x) : []);
  if (typeof h === "object") for (const k of ["lines", "raw", "hours", "text"]) if (h[k] != null) return hoursLines(h[k]);
  return [];
}
const DAY_EN = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"], DAY_DE = ["mo", "di", "mi", "do", "fr", "sa", "so"];
function dayIdx(tok) {
  const t = tok.toLowerCase(), en = DAY_EN.indexOf(t.slice(0, 3));
  return en >= 0 ? en : t.length <= 3 ? DAY_DE.indexOf(t.slice(0, 2)) : -1;
}
const hhmm = (h, m) => `${pad(+h)}:${m}`;
// "Mon - Fri: 07.00 - 19.00", "Sat - Sun: Closed", "Meal times: Mon - Fri: 11.15 - 14.00 and 17.30 - 19.30".
// `today` is 0 = Monday. Lines that aren't about days ("24-hour access via ETH card") are kept as notes.
function parseHours(lines, today) {
  const out = { open: null, closed: false, meal: [], notes: [], days: 0 };
  for (const line of lines) {
    const m = line.match(/^(?:(meal times?|essenszeiten?)\s*:\s*)?([a-zäöü]{2,})\.?(?:\s*[-–]\s*([a-zäöü]{2,})\.?)?\s*:\s*(.+)$/i);
    const a = m ? dayIdx(m[2]) : -1, b = m && m[3] ? dayIdx(m[3]) : a;
    if (a < 0 || b < 0) { out.notes.push(line); continue; }
    out.days++; if (m[1]) out.hasMeal = true;
    if (!(a <= b ? today >= a && today <= b : today >= a || today <= b)) continue;
    const ranges = [...m[4].matchAll(/(\d{1,2})[.:](\d{2})\s*[-–]\s*(\d{1,2})[.:](\d{2})/g)].map(r => [hhmm(r[1], r[2]), hhmm(r[3], r[4])]);
    if (m[1]) out.meal.push(...ranges);
    else if (/closed|geschlossen/i.test(m[4])) out.closed = true;
    else if (ranges.length) out.open = [...(out.open || []), ...ranges];
  }

}
const is24 = p => !!(p.hours && (p.hours.has24HourAccess || p.hours.access_24h)) || p.features.some(f => /24/.test(f.key)) ||
  hoursLines(p.hours).some(l => /24[- ]?(h\b|hour|std|stunden)/i.test(l));
const inRange = (min, [s, e]) => min >= toMin(s) && min < (e === "00:00" ? 1440 : toMin(e));
const fmtRanges = rs => rs.map(([s, e]) => `${s}–${e}`).join(", ");
const flagOpen = p => p.hours && typeof p.hours.isOpen === "boolean" ? p.hours.isOpen : null;

// Opening hours today as {line (HTML), open: true / false / null = unknown}, judged at the server's Zurich time.
function hoursInfo(p, nowIso) {
  const lines = hoursLines(p.hours), card24 = is24(p);
  if (!lines.length) return { line: card24 ? "24 h access" : "", open: card24 ? true : flagOpen(p) };
  const today = (new Date(nowIso.slice(0, 10) + "T00:00Z").getUTCDay() + 6) % 7, min = toMin(hm(nowIso));
  const h = parseHours(lines, today);
  // Unparseable, or no line for today: show every line as given.
  if (!h.days || (!h.open && !h.closed)) return { line: esc(lines.join("; ")), open: flagOpen(p) };
  const notes = h.notes.filter(n => !(card24 && /24/.test(n)) && !(h.hasMeal && /meal/i.test(n)));
  let open = !h.closed && h.open.some(r => inRange(min, r)), label;
  const meal = h.meal.find(r => inRange(min, r));
  if (open && meal) { open = false; label = `<span class="shut-now">Meal time until ${meal[1]}</span>`; }
  else if (open) label = `<span class="open-now">Open until ${h.open.find(r => inRange(min, r))[1]}</span>`;
  else if (card24) { open = true; label = `<span class="open-now">Open with ETH card</span>`; }
  else {
    const next = h.closed ? null : h.open.find(r => toMin(r[0]) > min);
    label = `<span class="shut-now">${h.closed ? "Closed today" : next ? `Closed, opens ${next[0]}` : "Closed now"}</span>`;
  }
  const parts = [label, h.closed ? (card24 ? "closed today" : "") : `today ${fmtRanges(h.open)}`].filter(Boolean);
  if (h.meal.length) parts.push(`no studying at meal times ${fmtRanges(h.meal)}`);
  if (card24) parts.push("24 h with ETH card");
  return { line: parts.concat(notes.map(esc)).join("; "), open };
}

function fmtAge(s) {
  const min = Math.round(s / 60);
  return min < 90 ? `${min} min` : min < 48 * 60 ? `${Math.round(min / 60)} h` : `${Math.round(min / 1440)} days`;
}
// One sample, shown honestly: no sample or no number -> no number; an old sample -> marked as old, grey light.
// Sources that only report rounded numbers: show their step with "~"; the others are counts, shown exactly.
const PCT_STEP = { uzh_ub: 5 };
function occ(s, seats, source) {
  if (!s) return { cls: "unknown", text: "no live data", rank: 2 };
  if (s.closed) return { cls: "closed", text: "closed", rank: 3 };
  const step = PCT_STEP[source] || 1;
  const free = s.pct == null ? null : Math.max(0, Math.min(100, Math.round((100 - s.pct) / step) * step));
  // Same thresholds as the server (places.status_for): green below 70 % occupied, yellow below 90 %.
  const st = s.status && s.status !== "unknown" ? s.status
    : free == null ? null : free > 30 ? "green" : free > 10 ? "yellow" : "red";
  if (!st) return { cls: "unknown", text: "no live data", rank: 2 };
  const n = s.max ?? seats;
  const word = { green: "plenty of space", yellow: "filling up", red: "almost full" }[st] || esc(st);
  const text = free == null ? word : `${step > 1 ? "~" : ""}${free}% free` + (n ? ` <small>of ${esc(n)}</small>` : "");
  if (s.age_s > STALE_S)
    return { cls: "unknown", text: `<span class="warn">${text}, ${fmtAge(s.age_s)} ago</span>`, rank: 1, free };
  const tr = { 1: ["↗", "filling up"], "-1": ["↘", "emptying"], 0: ["→", "steady"] }[s.trend]?.slice();
  if (tr && s.trend_source === "computed") tr[1] += " (last 15–30 min)";   // our own trend (places.computed_trend)
  return { cls: st, text: text + (tr ? ` <span class="trend" title="${tr[1]}" aria-label="${tr[1]}">${tr[0]}</span>` : ""), rank: 0, free };
}
// Popular times on the cards: the usual share free in this half hour (usual_now from api/places), next to
// the live value and in the same terms. Nothing when there isn't enough history (usual_now null).
function usualNow(p) {
  const u = p.usual_now;
  if (!u) return "";
  const step = PCT_STEP[p.source] || 1, free = Math.max(0, Math.min(100, Math.round((100 - u.pct) / step) * step));
  const tip = `Usually ${Math.round(u.pct)} % taken at ${u.slot} on this weekday (median of ${u.weeks} weeks)`;
  return ` <span class="usual-now" title="${esc(tip)}">usually ${step > 1 ? "~" : ""}${free}% free</span>`;
}
// A parent without a sample of its own (a library made of floors) shows the sum of its children's fresh

function aggregate(kids) {
  const ss = kids.map(k => k.latest).filter(s => s && !s.closed && s.count != null && s.max && s.age_s <= STALE_S);
  if (!ss.length) return null;
  const count = ss.reduce((a, s) => a + s.count, 0), max = ss.reduce((a, s) => a + s.max, 0);
  return { status: null, pct: count / max * 100, count, max, trend: null, closed: false, age_s: Math.max(...ss.map(s => s.age_s)) };

const featKeys = p => { const k = new Set(p.features.map(f => FEATURES[f.key] || f.label || f.key)); if (is24(p)) k.add("24 h"); return k; };

function spaceCard(r, closed) {
  const { p, o, h } = r;
  const where = [p.building && p.building !== p.name ? p.building : null, p.campus, p.uni].filter(Boolean).join(", ");
  const tags = [...featKeys(p)].filter(k => MAIN_FEATURES.includes(k) && k !== "24 h");
  const walk = state.pos ? walkHTML(p) : "";
  const subs = p.kids.length ? `<div class="subs">${p.kids.map(k => { const ko = occ(k.latest, k.seats, k.source);
    return `<div class="sub"><span><span class="dot ${ko.cls}" aria-hidden="true"></span>${esc(k.name)}</span><span class="status s-${ko.cls}">${ko.text}</span></div>`; }).join("")}</div>` : "";
  return `<div class="card scard${closed ? " soon" : ""}${state.place === p.id ? " sel" : ""}" data-id="${esc(p.id)}" role="button" tabindex="0">
    <div class="top"><span class="name"><span class="dot ${o.cls}" aria-hidden="true"></span>${esc(p.name)}</span><span class="status s-${o.cls}">${o.text}${usualNow(p)}</span></div>
    <div class="meta">${walk}${walk ? ", " : ""}${esc([where, tags.join(", ")].filter(Boolean).join(", "))}${p.url ? `, <a class="srclink" href="${esc(p.url)}" target="_blank" rel="noopener">Info ↗</a>` : ""}</div>

function renderSpaceFilters(all) {

  const main = MAIN_FEATURES.filter(k => keys.has(k)), more = [...keys].filter(k => !MAIN_FEATURES.includes(k)).sort();

function renderSpaces() {

  const rows = shown.map(p => ({ p, o: occ(p.latest || aggregate(p.kids), p.seats, p.source), h: hoursInfo(p, d.now) }));

  if (closed.length) html += `<h2>Closed now</h2>` + closed.map(r => spaceCard(r, true)).join("");

// Places by id, with each library's floors in `kids`; `top` are the ones listed as cards.
function placeTree(d) {
  const byId = new Map(d.places.map(p => [p.id, { ...p, campus: canonCampus(p.campus), features: p.features || [], kids: [] }]));
  for (const p of byId.values()) if (p.parent_id && byId.has(p.parent_id)) byId.get(p.parent_id).kids.push(p);
  const top = [...byId.values()].filter(p => !p.parent_id || !byId.has(p.parent_id));
  for (const p of top) p.kids.sort((a, b) => a.name.localeCompare(b.name, "en", { numeric: true }));

const CURVE_START = 6, CURVE_END = 24;   // hours shown in the day curve
const placeDays = new Map();             // place id -> { at, data } from api/place (or { at, error })
// The source of a place's samples isn't always the place's own source: ETH study spaces get theirs
// from eth_availability, and the ICBP library (an ETH study space) from icbp.
const sampleSource = p => p.kids.some(k => k.source === "icbp") ? "icbp" : p.source === "eth_studyspaces" ? "eth_availability" : p.source;
const SAMPLE_SOURCES = {

function loadPlaceDay(id) {
  const c = placeDays.get(id);
  if (c && (c.loading || Date.now() - c.at < PLACES_EVERY)) return;
  placeDays.set(id, { ...c, loading: true });
  fetch("api/place?" + q({ id }))
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(data => ({ at: Date.now(), data }), () => ({ at: Date.now(), data: c?.data, error: true }))
    .then(v => { placeDays.set(id, v); if (state.place === id) fillCurves(id); });

// One day of samples as an inline SVG area chart of the share occupied, 06:00–24:00 local time.
// A numeric sample counts until the next sample, but at most STALE_S; a no-data sample leaves a gap
// until the next one (runs of them are stored once); a closed one is shaded until the next one.
// `usual` (popular times, from api/place) adds one faint bar per slot behind the curve.
function curveSVG(samples, day, h = 64, usual = null) {

  const y = pct => top + (h - top) * (1 - Math.max(0, Math.min(100, pct)) / 100);
  const today = day.date === day.now.slice(0, 10), nowMin = today ? toMin(hm(day.now)) : 1440;
  const ss = samples.map(s => ({ ...s, m: toMin(hm(s.local)) }));
  let svg = `<line class="grid" x1="0" x2="${W}" y1="${y(70)}" y2="${y(70)}"/><line class="grid" x1="0" x2="${W}" y1="${y(90)}" y2="${y(90)}"/>`;
  for (const u of usual?.slots || []) {
    const a = x(toMin(u.start)), b = x(toMin(u.start) + usual.slot_min) - 1.5;
    if (b > a) svg += `<rect class="usual" x="${a.toFixed(1)}" y="${y(u.pct).toFixed(1)}" width="${(b - a).toFixed(1)}" height="${(h - y(u.pct)).toFixed(1)}"/>` +
      `<line class="utop" x1="${a.toFixed(1)}" x2="${b.toFixed(1)}" y1="${y(u.pct).toFixed(1)}" y2="${y(u.pct).toFixed(1)}"/>`;
  }
  const runs = []; let run = null;
  ss.forEach((s, i) => {
    const next = ss[i + 1], end = Math.min(next ? next.m : nowMin, s.m + STALE_S / 60);
    if (s.closed) {
      const e = next ? next.m : nowMin;

      run = null; return;
    }
    if (s.pct == null) { run = null; return; }
    if (!run) runs.push(run = []);
    run.push([s.m, s.pct]);
    if (!next || end < next.m) run = null;      // the next sample is too far away (or there is none): gap
  });
  for (const r of runs) {
    if (r.length === 1) { svg += `<circle class="pt" cx="${x(r[0][0])}" cy="${y(r[0][1])}" r="2"/>`; continue; }
    const pts = r.map(([m, p]) => `${x(m).toFixed(1)},${y(p).toFixed(1)}`).join(" ");
    svg += `<polygon class="area" points="${x(r[0][0]).toFixed(1)},${h} ${pts} ${x(r.at(-1)[0]).toFixed(1)},${h}"/><polyline class="ln" points="${pts}"/>`;
  }
  svg += `<line class="base" x1="0" x2="${W}" y1="${h}" y2="${h}"/>`;
  if (today) svg += `<line class="now" x1="${x(nowMin)}" x2="${x(nowMin)}" y1="0" y2="${h}"/>`;
  return `<svg class="curve" viewBox="0 0 ${W} ${h + 1}" role="img" aria-label="Share of seats taken over the day">${svg}</svg>`;
}
const curveTicks = () => `<div class="ticks">${[6, 9, 12, 15, 18, 21, 24].map(t => `<span>${t}</span>`).join("")}</div>`;

function curveBlock(samples, day, small, usual = null) {
  if (!samples.length && !usual?.slots.length) return `<p class="meta">No samples ${day.date === day.now.slice(0, 10) ? "today" : "that day"}.</p>`;
  const numeric = samples.some(s => s.pct != null && !s.closed);
  return curveSVG(samples, day, small ? 28 : 64, usual) + (small ? "" : curveTicks()) +
    (numeric ? "" : `<p class="meta">No live numbers ${day.date === day.now.slice(0, 10) ? "today" : "that day"}${samples.some(s => s.closed) ? " (closed)" : ""}.</p>`);
}

function fillCurves(id) {
  const c = placeDays.get(id), el = $("#pcurve");
  if (!el) return;
  if (!c?.data) { el.innerHTML = `<p class="meta">${c?.error ? "Couldn't load today's samples." : "Loading today's samples…"}</p>`; return; }
  const d = c.data, day = { date: d.date, now: d.now };
  const u = d.place.usual, bars = u?.slots.length > 0 || d.kids.some(k => k.usual?.slots.length);
  // A library made of floors has no samples of its own: its curves are the floors' (its usual bars are their sum).
  const own = d.place.samples.length || !d.kids.length || (d.place.latest && !d.place.latest.floors);
  el.innerHTML = (own ? curveBlock(d.place.samples, day, false, u)
      : curveSVG([], day, 64, u) + curveTicks() + `<p class="meta">Today's numbers are per floor, below.</p>`) + usualHTML(u, day) +
    `<div class="note">Share of seats taken, ${CURVE_START}:00–${CURVE_END}:00. Dashed lines: 70 % and 90 % (yellow and red). Grey: closed. Gaps: no data.${bars ? ` Faint bars: usual for a ${u?.weekday || "day like this"}.` : ""}</div>`;
  for (const k of d.kids) {
    const kel = document.querySelector(`.kcurve[data-id="${CSS.escape(k.id)}"]`);
    if (kel) kel.innerHTML = curveBlock(k.samples, day, true, k.usual);
  }
}

// Popular times in words: "usually X % at this time", "usually fills up by", or why there's nothing yet.
function usualHTML(u, day) {
  if (!u) return "";
  const wd = u.weekday;
  if (!u.slots.length) return `<p class="meta">Usual times: not enough history yet. They need ${u.min_weeks} ${wd}s with data in the last ${u.window_weeks} weeks; ${u.weeks ? `there ${u.weeks === 1 ? "is 1" : `are ${u.weeks}`} so far` : "there are none so far"}.</p>`;
  const most = Math.max(...u.slots.map(s => s.weeks));
  const lines = [`Usual ${wd}: median of ${most} ${wd}s in the last ${u.window_weeks} weeks (shown where at least ${u.min_weeks} have data).`];
  if (day.date === day.now.slice(0, 10)) {
    const m = toMin(hm(day.now)), cur = u.slots.find(s => toMin(s.start) <= m && m < toMin(s.start) + u.slot_min);
    if (cur) lines.push(`<b>Usually ${Math.round(cur.pct)} % taken</b> at this time.`);
  }
  if (u.fills_by) lines.push(`Usually fills up by ${esc(u.fills_by)} (90 % taken).`);
  return `<p class="meta">${lines.join(" ")}</p>`;
}

const DAY_LABEL = { mon: "Monday", tue: "Tuesday", wed: "Wednesday", thu: "Thursday", fri: "Friday", sat: "Saturday", sun: "Sunday" };
// The whole week from ETH's parsed hours (week/meals), else the lines as published.
function weekHTML(p, nowIso) {
  const h = p.hours, lines = hoursLines(h);
  const today = DAY_EN[(new Date(nowIso.slice(0, 10) + "T00:00Z").getUTCDay() + 6) % 7];
  let html = "";
  if (h && h.week && Object.keys(h.week).length) {
    html = `<dl class="kv">${DAY_EN.map(d => {
      const open = h.week[d], meals = h.meals?.[d] || [];
      const v = open == null ? "not stated" : open.length ? fmtRanges(open) : "closed";
      const cls = d === today ? ` class="today"` : "";
      return `<dt${cls}>${DAY_LABEL[d]}</dt><dd${cls}>${esc(v)}${meals.length ? `<br><span class="meta">meal times ${esc(fmtRanges(meals))}, no studying</span>` : ""}</dd>`;
    }).join("")}</dl>`;
    if (lines.length) html += `<details><summary>As published</summary>${lines.map(l => `<div>${esc(l)}</div>`).join("")}</details>`;
  } else if (lines.length) html = lines.map(l => `<div>${esc(l)}</div>`).join("");
  else html = `<p class="meta">No opening hours listed.</p>`;
  if (is24(p)) html += `<p>24-hour access with an ETH card.</p>`;
  return html;
}

// The minutely refresh rebuilds the panel. Remember which control had keyboard focus (and the
// scroll position) so a keyboard or screen-reader user isn't thrown back to the top of the page.
const FOCUSABLE = "a[href], button, summary, [tabindex]";
function panelFocus() {
  const panel = $("#panel"), a = document.activeElement;
  if (!a || a === panel || !panel.contains(a)) return { top: panel.scrollTop };
  return { top: panel.scrollTop, id: a.id, tag: a.tagName, href: a.getAttribute("href"), text: a.textContent,
           idx: [...panel.querySelectorAll(FOCUSABLE)].indexOf(a) };
}
function restorePanelFocus(f) {
  const panel = $("#panel");
  panel.scrollTop = f.top;
  if (f.tag == null) return;
  const all = [...panel.querySelectorAll(FOCUSABLE)];
  const el = (f.id && panel.querySelector("#" + CSS.escape(f.id)))
    || all.find(e => e.tagName === f.tag && e.getAttribute("href") === f.href && e.textContent === f.text)
    || all[Math.min(f.idx, all.length - 1)];
  el?.focus({ preventScroll: true });
}

function renderPlacePanel() {
  const d = state.places;
  if (!d) { $("#panel").innerHTML = `<div class="grab"></div><p class="meta">Loading…</p>`; return; }
  const { byId } = placeTree(d), p = byId.get(state.place);
  if (!p) { closePanel(); return; }
  const parent = p.parent_id && byId.get(p.parent_id);
  const o = occ(p.latest || aggregate(p.kids), p.seats, p.source), s = p.latest;
  const where = [p.building && p.building !== p.name ? p.building : null, p.campus, p.uni,
    p.seats ? `${p.seats} seats` : null].filter(Boolean).join(", ");
  const measured = s ? [s.floors ? "Sum of the floors below" : null, s.count != null && !s.closed ?`${Math.round(s.count)} people${s.max ? ` of ${s.max}` : ""}` : null,
      `measured ${fmtAge(s.age_s)} ago`, SAMPLE_SOURCES[sampleSource(p)] || SOURCE_NAMES[sampleSource(p)] || sampleSource(p)].filter(Boolean).join(", ")
    : p.kids.length && o.rank === 0 ? "Sum of the floors below" : "";
  const notice = p.hours?.notice && (p.hours.notice.en || p.hours.notice.de);
  // Keep "As published" open across the minutely refresh of the same place.

  let loc = null;
  try { const u = new URL(p.url); if (/ethz\.ch$/.test(u.hostname) && u.searchParams.get("building")) loc = Object.fromEntries(["building", "floor", "room"].map(k => [k, u.searchParams.get(k) || ""])); } catch {}
  const links = [
    p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${loc ? "Location" : "Official page"} ↗</a>` : "",
    loc ? `<a href="${ETH}/staffnet/de/service/raeume-gebaeude/rauminfo/raumdetails.html?${esc(q(loc))}" target="_blank" rel="noopener">Room details ↗</a>` : "",
    // Seminar rooms with a people counter are in the Rooms view too (their id there is the name).
    p.source === "eth_availability" ? `<a href="?view=rooms#room=${esc(encodeURIComponent(p.name))}">Bookings in Rooms view</a>` : "",
  ].join("");
  const bld = p.uni === "ETH" && (loc?.building || p.building);

  $("#panel").innerHTML = `<div class="grab"></div>
    <div class="ph"><div><div class="name">${esc(p.name)}</div>
      <div class="meta">${esc(where)}</div>${parent ? `<div class="meta">Part of ${esc(parent.name)}</div>` : ""}</div>
      <button class="x" id="close" aria-label="Close">✕</button></div>
    ${p.note ? `<div class="meta warn">${esc(p.note)}</div>` : ""}
    <div class="bigocc s-${o.cls}"><span class="dot ${o.cls}" aria-hidden="true"></span>${o.text}</div>
    ${measured ? `<div class="meta">${esc(measured)}</div>` : ""}
    ${hi.line ? `<div class="meta">${hi.line}</div>` : ""}
    ${dist(p) != null ? `<div class="meta"><span class="walk">${esc(walkText(dist(p), true))}</span> ${dist(p) >= 40 ? heading(state.pos, p) : ""}</div>` : ""}
    ${notice ? `<div class="stale">${esc(notice)}</div>` : ""}
    <h3>Today</h3>
    <div id="pcurve"></div>
    ${p.kids.length ? `<h3>Floors</h3>${p.kids.map(k => { const ko = occ(k.latest, k.seats, k.source);
      return `<div class="psub"><div class="sub"><span><span class="dot ${ko.cls}" aria-hidden="true"></span>${esc(k.name)}</span><span class="status s-${ko.cls}">${ko.text}</span></div>
        <div class="kcurve" data-id="${esc(k.id)}"></div></div>`; }).join("")}` : ""}
    <h3>Opening hours</h3>

    ${svg ? `<div><h3>Where is ${esc(bld)}</h3>
      <a class="plan" href="${svg}" target="_blank" rel="noopener"><img src="${svg}" alt="Campus map with building ${esc(bld)}" loading="lazy" onerror="this.closest('div').hidden=true"></a></div>` : ""}`;
  $("#panel").dataset.place = p.id;

  for (const c of document.querySelectorAll(".card.sel")) c.classList.remove("sel");

}

$("#sfilter").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const f = state.sp, x = b.dataset;
  if (x.more) state.spMore = !state.spMore;
  else if (x.uni || x.campus) clickWhere(f, x, state.places ? placeTree(state.places).top : []);
  else if (x.feat) f.feats = f.feats.includes(x.feat) ? f.feats.filter(k => k !== x.feat) : [...f.feats, x.feat];
  else if (x.nearsort) { toggleNearSort(); return; }
  store.set("sp", { feats: f.feats }); saveWhere();

});

// --- near: the one-tap answer (rooms free for the chosen duration + study places with room to spare) ---
const NEAR_FREE_PCT = 20;    // a study place counts when at least 20 % of its seats are free (< 80 % taken)
const NEAR_SHOW = 12;        // nearest ones listed; the rest behind "Show more"
Object.assign(state, { nearAll: false });

// The location state as a summary suffix (Rooms, Buildings and Study with "Nearest first" on).
function geoNote() {
  const picked = state.autoCampus && state.where.campus === state.autoCampus ? `, ${esc(state.autoCampus)} picked by your location` : "";
  if (state.geo === "ok" && state.pos) return state.pos.acc > 1000
    ? `, <span class="warn">location only roughly known (±${(state.pos.acc / 1000).toFixed(1)} km)</span>` : ", nearest first" + picked;
  return { asking: ", finding your location…", denied: `, <span class="warn">location blocked, so not sorted by distance</span>`,
    error: `, <span class="warn">location unavailable</span>`, unsupported: `, <span class="warn">this browser can't share its location</span>` }[state.geo] || "";
}
function toggleNearSort() {
  state.nearSort = !state.nearSort; store.set("nearsort", state.nearSort);
  if (state.nearSort) { geo.start(); autoCampus(); }
  render();
}

// Rooms (free now for state.min) and study places (open, live number, enough seats free), each with its distance.
function nearCandidates() {
  // Both universities, every campus: here only the distance decides (the filters in the other views don't apply).
  const out = [];
  for (const r of state.data?.rooms || [])
    if (goodFor(r)) out.push({ kind: "room", id: r.id, x: r, d: dist(r) });
  if (state.places) for (const p of placeTree(state.places).top) {
    const o = occ(p.latest || aggregate(p.kids), p.seats, p.source), h = hoursInfo(p, state.places.now);
    const roomy = o.free != null ? o.free >= NEAR_FREE_PCT : o.cls === "green";
    if (o.rank === 0 && h.open !== false && o.cls !== "closed" && roomy) out.push({ kind: "place", id: p.id, x: p, o, h, d: dist(p) });
  }
  // Nearest first; equally near: the room free longest, the place with most seats free.
  const score = c => c.kind === "room" ? -(c.x.minutes ?? 1e6) : -(c.o.free ?? 0);
  const known = heroFirst(out.filter(c => c.d != null).sort((a, b) => a.d - b.d || score(a) - score(b)),
    c => c.kind === "room" && c.x.unreliable, c => c.d);
  const unknown = out.filter(c => c.d == null).sort((a, b) => score(a) - score(b));
  return { known, unknown };
}

function nearHero(c, at) {
  if (c.kind === "room") {
    const r = c.x;
    return heroCard(r, at, multiUni(state.data.rooms), "Nearest free room");
  }
  const p = c.x, long = p.name.length > 12;
  const way = c.d != null ? `<div class="way">${esc(walkText(c.d, true))}${c.d >= 40 ? ` ${heading(state.pos, p)}` : ""}</div>` : "";
  const meta = [p.building && p.building !== p.name ? p.building : null, p.campus, p.uni].filter(Boolean).join(", ");
  return `<div class="card sign scard${long ? " long" : ""}${state.place === p.id ? " sel" : ""}" data-id="${esc(p.id)}" role="button" tabindex="0">
    <div class="kind">Nearest study space</div>
    <div class="name">${esc(p.name)}</div>
    <div class="until"><span class="dot ${c.o.cls}" aria-hidden="true"></span>${c.o.text}</div>
    ${way}
    <div class="meta">${[c.h.line, esc(meta)].filter(Boolean).join(", ")}</div></div>`;
}
const nearItem = (c, at) => c.kind === "room" ? card(c.x, at, multiUni(state.data.rooms))
  : spaceCard({ p: c.x, o: c.o, h: c.h }, false);

function renderNear() {
  const d = state.data, at = d?.at;
  $("#footer").innerHTML = `Your location stays in this browser: distances are worked out on your device and never sent to the server. ` +
    `Walking times are rough: 4.8 km/h, paths a quarter longer than a straight line, to the middle of the building. ` +
    `Rooms count when nothing is booked for ${dur(state.min) || "a while"}, study spaces when they are open and at least ${NEAR_FREE_PCT}% of the seats are free right now. Not an official ETH or UZH service.`;
  if (!d) { $("#summary").textContent = "Loading…"; $("#list").innerHTML = ""; return; }
  if (state.geo !== "ok" || !state.pos) {
    const why = { asking: "Waiting for your location…", denied: "Location is blocked for this site. Allow it in the browser settings, or use the campus filters in Rooms and Study.",
      error: "Couldn't get your location. Try again, maybe outside or with Wi-Fi on.", unsupported: "This browser can't share its location. Use the campus filters in Rooms and Study." }[state.geo];
    $("#summary").innerHTML = why ? esc(why) : "The nearest room or study space that's free right now";
    const btn = state.geo === "asking" || state.geo === "unsupported" ? "" : `<button class="chip" id="locate">${state.geo === "off" ? "Use my location" : "Try again"}</button>`;
    $("#list").innerHTML = `<div class="card sign ask"><div class="kind">Near me</div><div class="name">Where are you?</div>
      <p>One tap finds the nearest room that's free for ${dur(state.min) || "now"} and the nearest study space with seats to spare. Your location stays on this device.</p>${btn}</div>`;
    renderHealth(d); return;
  }
  const { known, unknown } = nearCandidates();
  const shown = state.nearAll ? known : known.slice(0, NEAR_SHOW);
  $("#summary").innerHTML = `<b>${known.length + unknown.length}</b> free place${known.length + unknown.length === 1 ? "" : "s"} right now` +
    (state.min ? `, rooms for ${dur(state.min)}+` : "") + (!state.places ? ", loading study spaces…" : "") + (state.pos.acc > 1000 ? geoNote() : "");
  let html = shown.length ? nearHero(shown[0], at) + shown.slice(1).map(c => nearItem(c, at)).join("")
    : `<div class="empty">${unknown.length ? "Nothing free with a known location." : "Nothing free right now. Try a shorter duration."}</div>`;
  if (known.length > shown.length) html += `<p><button class="chip more" id="nearall">Show ${known.length - shown.length} more</button></p>`;
  if (unknown.length) html += `<h2>Distance unknown</h2><p class="meta">No coordinates for these buildings yet.</p>` +
    `<div class="unknown-dist">${unknown.slice(0, 8).map(c => nearItem(c, at)).join("")}</div>` +
    (unknown.length > 8 ? `<p class="meta">and ${unknown.length - 8} more in Rooms and Study.</p>` : "");
  $("#list").innerHTML = html;
  renderHealth(d);
  if (state.room) renderPanel();
  if (state.place) renderPlacePanel();
}

// --- controls ---

const params = new URLSearchParams(location.search);
const urlAt = params.get("at");                     // shareable: /?at=2026-11-12T14:00
if (["rooms", "buildings", "spaces", "near"].includes(params.get("view"))) state.view = params.get("view");   // /?view=buildings
if (urlAt) { state.when = urlAt; $("#at").value = urlAt.slice(0, 16); press("when", "when", "-"); }
press("dur", "min", state.min);
const INITIAL = /*INITIAL_DATA*/null;
const startPanel = panelFromHash();
if (startPanel?.kind === "place" && state.view !== "near") state.view = "spaces";   // /?view=spaces#place=eth_studyspaces:HGH30.1
function start() {
  if (startPanel?.kind === "room" && state.data.rooms.some(r => r.id === startPanel.id)) openPanel(startPanel.id, false);
}
const INITIAL_PLACES = /*INITIAL_PLACES*/null;    // only inlined for /?view=spaces
if (INITIAL_PLACES) { state.places = INITIAL_PLACES; state.placesAt = Date.now(); }
if (startPanel?.kind === "place") openPanel(startPanel.id, false, "place");   // closes itself if the id is unknown
if (INITIAL) { setData(INITIAL); fillBuildings(); render(); start(); } else load().then(start);
if (state.view === "near" && state.when !== "now") { state.when = "now"; press("when", "when", "now"); $("#at").value = ""; }
if ((state.view === "spaces" || state.view === "near") && !INITIAL_PLACES) loadPlaces();
// Location only starts by itself when this browser already allowed it once and it's in use.
if (wantsGeo() && store.get("geo", false)) geo.start();
setInterval(() => { if (state.when === "now") load(); }, 5 * 60 * 1000);
// Occupancy changes by the minute: refresh study spaces every 60 s, but only while they're on screen.
// Study and Near show live occupancy, so refresh it every minute while one of them is on screen.
const placesOnScreen = () => state.view === "spaces" || state.view === "near";
setInterval(() => { if (placesOnScreen() && document.visibilityState === "visible") loadPlaces(); }, PLACES_EVERY);
document.addEventListener("visibilitychange", () => {
  if (placesOnScreen() && document.visibilityState === "visible" && Date.now() - state.placesAt > PLACES_EVERY) loadPlaces();
});
</script>
</body>
