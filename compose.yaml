services:
  freerooms:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      FREEROOMS_REFRESH_HOURS: "2"     # ETH every 2h (~1 min, ~185 requests), UZH every 6h (~40 s, 10 requests)
      # FREEROOMS_UNIS: "ETH,UZH"
      FREEROOMS_LIVE: "1"              # live study-space/library occupancy every 5 min
      # FREEROOMS_BUILDINGS: "HG,CAB,ML"
      # FREEROOMS_DAYS: "7"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 1m
